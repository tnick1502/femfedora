name: emo-core
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Заполните POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-emo}
    volumes:
      - emo_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:${EMO_HTTP_PORT:-8086}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "emo_core.workers.proactive_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  emo_db:
