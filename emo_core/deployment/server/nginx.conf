server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 81.31.245.115;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/emo-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://81.31.245.115$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 81.31.245.115;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/emo-core.error.log warn;

    ssl_certificate /etc/letsencrypt/live/emo-core-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emo-core-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EMO_TLS:10m;
    ssl_session_tickets off;
    client_max_body_size 1m;

    # Voice upload is capped again by the API while streaming and after decoding.
    location ~ ^/api/v1/emo/conversations/[0-9a-fA-F-]+/voice-messages$ {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 240s;
        proxy_buffering off;
    }
}
