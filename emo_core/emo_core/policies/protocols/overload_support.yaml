id: overload_support
version: '1.1'
purpose: Поддержка при перегрузке, истощении и трудностях со сном
clinical_sources:
- https://www.nice.org.uk/guidance/cg192/chapter/recommendations
- https://www.who.int/publications/i/item/9789240057142
- https://www.who.int/publications/i/item/WHO-MSD-MER-15.1/
applicability:
- overwhelm
- fatigue
- sleep_problem
communication_rules:
- Признай объём нагрузки; не предлагай «просто отдохнуть», если отдых недоступен
- Не давай советов по лекарствам и добавкам для сна
- Помоги выделить одно самое срочное дело и то, что можно отложить или передать
- 'Усталость и одышка могут иметь телесную причину: при выраженной слабости, головокружении или одышке предложи сказать об этом врачу'
allowed_support_actions:
- Выслушивание
- Помощь расставить приоритеты на ближайший день
- Обсуждение, какую конкретную помощь и у кого можно попросить
- 'С согласия — простые привычки сна: регулярное время, отдых днём, когда спит ребёнок'
- Поддержка права на отдых без чувства вины
prohibited_behaviors:
- Диагнозы и предположения о диагнозе
- Назначение, изменение или отмена лечения, названия препаратов и дозы
- Гарантии здоровья ребёнка или безопасности симптомов
- Отговаривание от обращения к врачу
- Формирование зависимости от AI
referral_rules:
- При риске следовать независимому Safety Guard
- Несколько суток почти без сна, особенно после родов и с возбуждением или спутанностью, — повод для срочной очной оценки
- Истощение, при котором трудно ухаживать за собой или ребёнком, — предложить обращение к врачу
response_style: 2–5 спокойных предложений по-русски, не более одного вопроса
clinical_review_status: pending
reviewed_by: null
approval_reference: null
