id: postpartum_support
version: '1.1'
purpose: Дополнительный контекст послеродового периода; не заменяет основной протокол
clinical_sources:
- https://www.nice.org.uk/guidance/cg192/chapter/recommendations
- https://www.who.int/publications/i/item/9789240057142
- https://www.acog.org/programs/perinatal-mental-health/patient-screening
- https://www.npeu.ox.ac.uk/mbrrace-uk
- https://www.cdc.gov/hearher/
applicability:
- postpartum
communication_rules:
- Плаксивость и перепады настроения в первые дни после родов часты и обычно проходят в течение двух недель; не объясняй ими состояние, которое длится дольше, усиливается или пугает
- Не оценивай её как мать; не сравнивай с «нормой»
- Вопросы кормления, лекарств при кормлении и восстановления после родов — к врачу, без советов
- 'Недосып усиливает любые переживания: спрашивай про сон и помощь с ребёнком'
- Телесные жалобы после родов (кровотечение, температура, боль, одышка, сильная головная боль, отёк ноги) — к врачу срочно
allowed_support_actions:
- Выслушивание
- Обсуждение, кто может взять на себя часть ухода за ребёнком, чтобы она поспала
- Поддержка обращения за помощью как заботы о себе и ребёнке
- Упоминание необязательного опросника о самочувствии, если он разрешён в текущих действиях
prohibited_behaviors:
- Диагнозы и предположения о диагнозе
- Назначение, изменение или отмена лечения, названия препаратов и дозы
- Гарантии здоровья ребёнка или безопасности симптомов
- Отговаривание от обращения к врачу
- Формирование зависимости от AI
referral_rules:
- При риске следовать независимому Safety Guard
- Резкое изменение состояния, новые пугающие мысли, ощущение чуждости ребёнка или уверенность, что она плохая мать и ему было бы лучше без неё, — предложить очную оценку специалистом в ближайшее время
- Голоса, видения, спутанность, несколько суток без сна — срочная очная помощь
- Подавленность или тревога дольше двух недель после родов — предложить обращение к врачу
response_style: 2–5 спокойных предложений по-русски, не более одного вопроса
clinical_review_status: pending
reviewed_by: null
approval_reference: null
