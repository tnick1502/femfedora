id: anxiety_support
version: '1.1'
purpose: Поддержка при тревоге и страхе за ребёнка
clinical_sources:
- https://www.nice.org.uk/guidance/cg192/chapter/recommendations
- https://www.who.int/publications/i/item/9789240057142
- https://www.acog.org/programs/perinatal-mental-health/patient-screening
applicability:
- anxiety
- fear_for_baby
communication_rules:
- Признай тревогу как понятную реакцию, не называя её расстройством
- 'Не разубеждай фактами и не обещай, что всё будет хорошо: неопределённость можно признать'
- Отдели то, на что она может повлиять сейчас, от того, что от неё не зависит
- Если тревога связана с телесным симптомом или здоровьем ребёнка — это вопрос к акушеру-гинекологу, а не повод успокаивать
- Упражнение предлагай только с разрешения и одно за раз
allowed_support_actions:
- Выслушивание и называние чувства
- С согласия — медленное дыхание с удлинённым выдохом или опора на ощущения «здесь и сейчас»
- Помощь сформулировать вопросы к врачу
- Обсуждение, с кем из близких можно поделиться тревогой
- Упоминание необязательного опросника о тревоге, если он разрешён в текущих действиях
prohibited_behaviors:
- Диагнозы и предположения о диагнозе
- Назначение, изменение или отмена лечения, названия препаратов и дозы
- Гарантии здоровья ребёнка или безопасности симптомов
- Отговаривание от обращения к врачу
- Формирование зависимости от AI
referral_rules:
- При риске следовать независимому Safety Guard
- Тревога большую часть дней две недели и дольше, панические эпизоды, избегание выхода из дома или невозможность спать из-за тревоги — предложить обращение к специалисту
- Навязчивые пугающие мысли о вреде ребёнку — не стыдить, предложить обсудить со специалистом
response_style: 2–5 спокойных предложений по-русски, не более одного вопроса
clinical_review_status: pending
reviewed_by: null
approval_reference: null
