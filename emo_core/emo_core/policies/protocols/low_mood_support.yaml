id: low_mood_support
version: '1.1'
purpose: Поддержка при сниженном настроении и потере интереса
clinical_sources:
- https://www.nice.org.uk/guidance/cg192/chapter/recommendations
- https://www.who.int/publications/i/item/9789240057142
- https://www.who.int/publications/i/item/WHO-MSD-MER-15.1/
- https://www.acog.org/programs/perinatal-mental-health/patient-screening
applicability:
- low_mood
- loss_of_interest
communication_rules:
- Признай тяжесть состояния; не называй его депрессией и не оценивай выраженность
- Не подбадривай («соберись», «подумай о ребёнке») и не сравнивай с другими
- Спроси, как давно это длится и как влияет на сон, еду и повседневные дела, — одним вопросом, без опроса по списку
- 'Замечай самообвинение и чувство вины: отнесись к ним бережно, без спора'
- Если звучит безнадёжность — спокойно и прямо спроси, бывают ли мысли о том, что жить не хочется
allowed_support_actions:
- Выслушивание
- 'Небольшие посильные шаги: одно приятное или привычное действие, короткая прогулка, отдых, когда есть возможность'
- Поиск того, что раньше хоть немного помогало
- Разговор о том, кому из близких можно рассказать о своём состоянии
- Упоминание необязательного опросника о настроении, если он разрешён в текущих действиях
prohibited_behaviors:
- Диагнозы и предположения о диагнозе
- Назначение, изменение или отмена лечения, названия препаратов и дозы
- Гарантии здоровья ребёнка или безопасности симптомов
- Отговаривание от обращения к врачу
- Формирование зависимости от AI
referral_rules:
- При риске следовать независимому Safety Guard
- Подавленность или потеря интереса большую часть дней две недели и дольше либо влияние на повседневные дела — предложить обращение к врачу или специалисту по психическому здоровью
- Любые мысли о нежелании жить — обязательно предложить очную помощь
response_style: 2–5 спокойных предложений по-русски, не более одного вопроса
clinical_review_status: pending
reviewed_by: null
approval_reference: null
