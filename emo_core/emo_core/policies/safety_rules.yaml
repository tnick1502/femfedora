version: '1.5'
clinical_review_status: pending
reviewed_by: null
approval_reference: null
# Сколько дней после срочного маршрута не отправлять обычные инициативные сообщения
# и не предлагать опросники.
urgent_cooldown_days: 30
# Постоянное основание для обращения к специалисту (устойчивые жалобы, результат шкалы)
# напоминается не чаще одного раза в столько дней, а не в каждом ответе.
referral_reminder_days: 7
# Сколько дней результат опросника считается актуальным основанием для рекомендации.
screening_result_valid_days: 30
# Длительность, а не частота: жалоба считается устойчивой, если наблюдалась не менее чем
# в min_distinct_days разных дней за window_days и растянута минимум на min_span_days.
persistence:
  window_days: 30
  min_distinct_days: 3
  min_span_days: 14
# Страна по умолчанию для номеров экстренных служб, если основное приложение её не передало.
# Текст всегда называет страну явно, чтобы номер не был принят за универсальный.
default_country: RU
emergency_contacts:
  RU:
    text: 'В России: единый номер экстренных служб 112, скорая помощь 103.'
    # Те же номера в структурном виде: интерфейс строит из них кнопки звонка.
    phones:
    - number: '112'
      label: Единый номер экстренных служб
    - number: '103'
      label: Скорая помощь
    verified_at: '2026-11-10'
    sources:
    - https://mchs.gov.ru/deyatelnost/press-centr/novosti/1431843
    - https://www.mos.ru/otvet-ekstrennie-situacii/kak-poluchit-ekstrennuyu-suicidologicheskuyu-pomosch
  default:
    text: 'Номер экстренных служб зависит от страны проживания.'
# Линия психологической помощи, которую можно назвать в ответе в крайнем случае.
# Ответ модели с любым другим телефоном или сайтом блокируется проверкой выхода.
support_contacts:
  RU:
    text: 'Федеральная горячая линия психологической помощи беременным и мамам: 8 800 2000 492 — круглосуточно, бесплатно и анонимно; сайт womenprolife.ru.'
    phone: '88002000492'
    phone_display: 8 800 2000 492
    label: Психологическая помощь беременным и мамам
    hours: круглосуточно, бесплатно
    site: womenprolife.ru
    operator: Благотворительный фонд «Женщины за жизнь»
    verified_at: '2026-11-10'
    sources:
    - https://womenprolife.ru/projects/35
    - https://womenprolife.ru/news/177
    note: >-
      Линия заявлена как неотложная психологическая помощь женщинам в ситуации репродуктивного
      выбора; фонд открыто продвигает сохранение беременности. Это не специализированная
      суицидологическая служба. Уместность для продукта решает клинический ответственный.
urgent_template: >-
  Мне очень жаль, что сейчас так тяжело. То, о чём ты пишешь, важно и требует помощи живого человека прямо сейчас.
  Если есть непосредственная опасность для тебя или ребёнка, обратись в экстренную службу или ближайшее отделение неотложной помощи. {emergency}
  По возможности не оставайся одна: попроси близкого человека побыть рядом. {support}
  Этот чат не вызывает помощь и не находится под наблюдением врача.
medical_urgent_template: >-
  То, что ты описываешь, может требовать срочной медицинской оценки, и её нельзя провести в чате.
  Пожалуйста, не откладывай: свяжись со своим врачом или роддомом либо вызови скорую помощь. {emergency}
  Скажи, что ты беременна или недавно родила, и опиши симптомы.
  Этот чат не вызывает помощь и не заменяет осмотр врача.
mental_state_urgent_template: >-
  То, что ты описываешь, важно показать врачу сегодня, не откладывая: такие состояния во время беременности и после родов требуют очной оценки, и это не твоя вина.
  Пожалуйста, позвони своему врачу или вызови скорую помощь и попроси близкого человека побыть рядом, пока тебя не осмотрят. {emergency}
  Если появляются мысли причинить вред себе или ребёнку, обращайся за помощью сразу.
  Этот чат не вызывает помощь и не заменяет осмотр врача.
professional_template: >-
  Такие переживания заслуживают внимания и поддержки. Пожалуйста, обсуди своё состояние с врачом или квалифицированным специалистом по психическому здоровью. Если есть непосредственная опасность, нужна срочная очная помощь. {emergency} {support}
# Ответ модели дважды не прошёл проверку на обычном маршруте: честно сказать о границах.
output_blocked_template: >-
  Я не могу оценивать здоровье, давать обещания или медицинские советы — это вопрос к врачу. Но я рядом и готова выслушать. Расскажи, что тебя сейчас беспокоит больше всего?
limited_template: >-
  Сейчас я могу предложить только ограниченную поддержку: безопасно оценить сообщение не удалось. Если тебя беспокоит самочувствие, обратись к врачу или квалифицированному специалисту. При непосредственной опасности обратись за срочной очной помощью. {emergency}
context_overflow_template: >-
  Эта беседа стала слишком длинной, чтобы я могла учесть её целиком. Твоё сообщение сохранено. Можно начать новую беседу или включить сжатие контекста в настройках. Если нужна поддержка сейчас, свяжись с близким человеком или специалистом; при непосредственной опасности обратись за срочной очной помощью. {emergency}
technical_template: >-
  Сейчас сервис ответа временно недоступен. Твоё сообщение сохранено. Если нужна поддержка, можно связаться с близким человеком или специалистом; при непосредственной опасности обратись за срочной очной помощью. {emergency}
# Добавляется кодом к ответу модели при любых признаках мыслей о самоповреждении
# без явного намерения: рекомендация не должна зависеть от свободной генерации.
self_harm_addendum: >-
  Мысли о причинении себе вреда — повод поговорить с врачом или специалистом по психическому здоровью в ближайшее время. Если они усиливаются или появляется намерение, обратись за срочной помощью. {emergency} {support}
questionnaire_safety_template: >-
  В ответах отмечены мысли о причинении себе вреда. Пожалуйста, свяжитесь с врачом
  или специалистом по психическому здоровью сейчас для оценки безопасности,
  не ожидая завершения теста или повторного прохождения. Если есть непосредственная
  опасность для вас или ребёнка, обратитесь в экстренную службу или ближайшее
  отделение неотложной помощи. {emergency} {support}
  По возможности попросите человека рядом побыть с вами.
  Этот сервис не вызывает помощь и не находится под постоянным наблюдением врача.
