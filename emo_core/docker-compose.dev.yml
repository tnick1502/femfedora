# Режим разработки: код и политики берутся из рабочей папки, API перезапускается при правках.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d
# Не использовать в production: образ должен содержать проверенный код.
services:
  api:
    volumes:
      - ./emo_core:/app/emo_core:ro
      - ./demo:/app/demo:ro
      - ./tools:/app/tools:ro
    command: ["uvicorn", "emo_core.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--reload", "--reload-dir", "/app/emo_core"]
  worker:
    volumes:
      - ./emo_core:/app/emo_core:ro
