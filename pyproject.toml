[project]
name = "femfedora"
version = "0.1.0"
description = "Pregnancy risk research workspace and reproducible ML baselines"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scipy>=1.14,<2",
    "scikit-learn>=1.7,<2",
    "catboost>=1.2.8,<2",
    "lightgbm>=4.6,<5",
    "pyarrow>=18,<30",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13.2,<0.14",
    "psutil>=6,<8",
    "tqdm>=4.66,<5",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "ipython>=8.20,<10",
    "ipykernel>=6.29,<8",
    "ipywidgets>=8.1,<9",
    "jupyterlab>=4.2,<5",
    "nbformat>=5.10,<6",
    "nbconvert>=7.16,<8",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "tmp", "data", "models", "output"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
